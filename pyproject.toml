[project]
name = "mamba-onnx"
version = "0.1.0"
description = "Mamba Selective Scan Custom Op for ONNX Runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",
]

[project.optional-dependencies]
dev = [
    "torch>=2.0.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "einops>=0.7.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["scikit-build-core>=0.5", "cmake>=3.18"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.version = ">=3.18"
cmake.build-type = "Release"
# The wheel will contain the Python package + compiled .so
wheel.packages = ["src/mamba_onnx"]
wheel.install-dir = "mamba_onnx"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
