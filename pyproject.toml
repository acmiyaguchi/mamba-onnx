[project]
name = "mamba-onnx"
version = "0.1.0"
description = "Mamba Selective Scan Custom Op for ONNX Runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",
    "torch>=2.0.0",
]

[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.version = ">=3.18"
cmake.source-dir = "csrc"
# Install the library into the package directory
wheel.packages = ["src/mamba_onnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"